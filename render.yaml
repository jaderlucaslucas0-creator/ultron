services:
  - type: web
    name: open-ultron
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ultron-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: ultron-db
    plan: free
