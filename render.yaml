services:
  - type: web
    name: ultron-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ULTRON_NAME
        value: ULTRON
      - key: DATABASE_PATH
        value: /tmp/ultron.db
