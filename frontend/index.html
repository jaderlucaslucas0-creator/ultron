<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ULTRON AI</title><style>*{box-sizing:border-box}body{margin:0;background:#010409;color:#dffaff;font-family:Arial;min-height:100vh}.shell{max-width:1200px;margin:auto;padding:24px}.top{text-align:center;padding:20px}.logo{font-size:42px;letter-spacing:12px;color:#36e5ff;text-shadow:0 0 25px #00bfff}.status{color:#5cffae}.grid{display:grid;grid-template-columns:1fr 280px;gap:18px}.panel{background:#061019;border:1px solid #0b5368;border-radius:20px;padding:18px;box-shadow:0 0 30px #001a25}.chat{height:60vh;overflow:auto}.msg{padding:14px;margin:10px;border-radius:14px;white-space:pre-wrap}.u{background:#07516a;margin-left:15%}.b{background:#0a1720;margin-right:15%}.bar{display:flex;gap:8px;margin-top:12px}.bar input{flex:1;padding:15px;background:#02070b;color:white;border:1px solid #17657b;border-radius:12px}.bar button{padding:0 18px;background:#11c6eb;border:0;border-radius:12px;font-weight:bold}.side button{width:100%;margin:6px 0;padding:12px;background:#071c27;color:#bff6ff;border:1px solid #12556a;border-radius:10px;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr}.side{display:none}}</style></head><body><div class="shell"><header class="top"><div class="logo">ULTRON</div><div class="status">● SISTEMA ONLINE</div></header><div class="grid"><section class="panel"><div id="chat" class="chat"><div class="msg b">ULTRON iniciado. Estou pronto.</div></div><form id="form" class="bar"><input id="input" placeholder="Comando ou pergunta..." autocomplete="off"><button>ENVIAR</button><button type="button" id="mic">🎙️</button></form></section><aside class="panel side"><h3>SISTEMAS</h3><button onclick="send('Pesquise as principais notícias de tecnologia')">🔎 Pesquisa</button><button onclick="send('Olá ULTRON')">🧠 IA</button><button onclick="loadMemory()">💾 Memória</button><button onclick="clearMemory()">🗑️ Limpar memória</button><small>IA local • agentes • pesquisa • memória • voz • desktop • automação</small></aside></div></div><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input');function add(t,c){let x=document.createElement('div');x.className='msg '+c;x.textContent=t;chat.appendChild(x);chat.scrollTop=chat.scrollHeight}async function send(m){input.value=m;document.querySelector('#form').requestSubmit()}document.querySelector('#form').onsubmit=async e=>{e.preventDefault();let m=input.value.trim();if(!m)return;add(m,'u');input.value='';let x=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});let d=await x.json();add(d.reply||d.detail,'b');if('speechSynthesis'in window)speechSynthesis.speak(new SpeechSynthesisUtterance(d.reply||''))};async function loadMemory(){let r=await fetch('/api/memory/default');let d=await r.json();add('Memória: '+d.messages.map(x=>x.role+': '+x.content).join(' | '),'b')}async function clearMemory(){await fetch('/api/memory/default',{method:'DELETE'});add('Memória limpa.','b')}document.querySelector('#mic').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){add('Reconhecimento de voz não disponível neste navegador.','b');return}let r=new R();r.lang='pt-BR';r.onresult=e=>{input.value=e.results[0][0].transcript;document.querySelector('#form').requestSubmit()};r.start()};</script></body></html>
